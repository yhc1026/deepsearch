[project]
name = "deepsearch-agents"
version = "0.1.0"
description = "DeepAgents learning examples for deep research agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.5.7",
    "mcp>=1.0.0",
    "fastapi>=0.100.0",
    "langchain==1.2.17",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai==1.2.1",
    "langgraph==1.1.10",
    "mysql-connector-python>=8.0.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.6",
    "chromadb>=0.5.0",
    "pyyaml>=6.0",
    "reportlab>=4.0.0",
    "tavily-python==0.7.24",
    "typing-extensions>=4.5.0",
    "uvicorn[standard]>=0.20.0",
    "aiosqlite>=0.22.1",
    "a2a-sdk>=1.1.2",
]

[project.optional-dependencies]
orchestrator = [
    "langchain-community>=0.2.0",
    "pandas>=2.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "python-multipart>=0.0.6",
    "reportlab>=4.0.0",
]
network-search = [
    "tavily-python==0.7.24",
]
database-query = [
    "mcp>=1.0.0",
    "mysql-connector-python>=8.0.0",
]
ragflow = [
    "ragflow-sdk>=0.1.0",
]
vector-search = [
    "chromadb>=0.5.0",
]

[tool.uv]
package = false
