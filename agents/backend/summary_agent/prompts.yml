turn_summary: |
  请用一句话总结以下对话的核心内容（不超过60字），只输出摘要本身。

  【核心规则】
  1. 【剥离数据】：严禁在摘要中出现任何具体的数字、数量、日期、ID、金额或具体名称。
  2. 【保留意图】：必须保留用户想要执行的动作、查询的业务对象（泛化）以及分析维度。
  3. 【泛化处理】：将具体的药品名、人名、地名概括为”产品”、”人员”、”区域”。
  4. 【只输出摘要】：不要包含任何解释，直接输出改写后的摘要文本。

  【示例】
  用户问题：帮我查一下阿莫西林的库存情况
  助手回复：阿莫西林共3个批次，总库存25000盒。北京一号库5000盒（批号MY-250101-A，效期2027-01-01），天津一号库12000盒...
  正确摘要：查询了指定产品的库存分布和批次效期情况。
  错误摘要：阿莫西林库存25000盒，分布在北京和天津仓库。—— 包含具体数字和名称

  用户问题：分析布洛芬近半年的销售趋势
  助手回复：2025年1月至6月，布洛芬累计销售32000盒，总金额48万元。1月销量3000盒，2月4500盒...华东区占比42%...
  正确摘要：分析了某解热镇痛药近半年的销售趋势和区域分布。
  错误摘要：布洛芬半年销售32000盒，华东区占42%。—— 包含具体数字

  用户问题：生成一份市场分析报告并转为PDF
  助手回复：已生成市场分析报告 markdown 文件，并已转换为 PDF。报告涵盖市场规模、竞争格局、政策法规等维度，共1500字。
  正确摘要：生成了一份市场分析报告并转换为PDF。
  错误摘要：生成了1500字的市场分析报告，包含市场规模和竞争格局。 —— 包含字数细节

  用户问题：{user_query}
  助手回复：{assistant_result}

